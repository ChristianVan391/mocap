<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoCap – Video to BVH</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #14171c;
      --panel-light: #1d222a;
      --border: #2a3038;
      --text: #d6dbe2;
      --text-dim: #8a929c;
      --accent: #4a8cff;
      --accent-hover: #3a7be0;
      --success: #3fb96f;
      --danger: #e05a5a;
      --pose-color: #00e676;
      --radius: 8px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .app-header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .app-title { font-size: 1.3rem; font-weight: 600; letter-spacing: 0.5px; color: #fff; }
    .app-title span { color: var(--accent); }
    .app-version {
      font-size: 0.8rem;
      color: var(--text-dim);
      background: var(--panel-light);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .main-container {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .video-panel {
      flex: 3;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }
    .video-wrapper {
      position: relative;
      flex: 1;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #videoFit { position: absolute; width: 0; height: 0; }
    .video-wrapper video,
    .video-wrapper canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: fill;
    }
    .video-wrapper canvas { z-index: 2; pointer-events: none; }

    .control-panel {
      flex: 1;
      min-width: 300px;
      max-width: 380px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-y: auto;
    }

    .section { display: flex; flex-direction: column; gap: 10px; }
    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      font-weight: 600;
    }

    .file-drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: var(--panel-light);
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    .file-drop-zone:hover, .file-drop-zone.drag-over {
      border-color: var(--accent);
      color: var(--text);
      background: #1a2030;
    }
    .file-drop-zone input { display: none; }

    .btn {
      background: var(--panel-light);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s, transform 0.05s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    .btn:hover:not(:disabled) { background: #232a33; border-color: #3a4450; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }

    .preview-buttons { display: flex; gap: 10px; }
    .preview-buttons .btn { flex: 1; }
    .preview-time { font-size: 0.9rem; color: var(--text-dim); text-align: center; }

    .progress-container { width: 100%; height: 6px; background: #222831; border-radius: 3px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: width 0.1s linear; }

    .status-box {
      background: var(--panel-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--text-dim);
      min-height: 44px;
      word-break: break-word;
    }
    .status-box.error { border-color: var(--danger); color: var(--danger); }
    .status-box.success { border-color: var(--success); color: var(--success); }

    .info-row { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-dim); }
    .info-row span:last-child { color: var(--text); font-weight: 500; }

    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .control-row label { flex: 0 0 auto; }
    .control-row input[type="number"] {
      background: var(--panel-light);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 6px 8px;
      font-size: 0.85rem;
      width: 90px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text);
      cursor: pointer;
    }
    .checkbox-row input { width: auto; }

    @media (max-width: 800px) {
      .main-container { flex-direction: column; }
      .control-panel {
        max-width: none;
        border-left: none;
        border-top: 1px solid var(--border);
        flex-direction: row;
        flex-wrap: wrap;
        gap: 12px;
        padding: 12px;
      }
      .section { flex: 1 1 45%; min-width: 200px; }
      .btn { width: auto; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-title">Mo<span>Cap</span></div>
    <div class="app-version">v1.0.1</div>
  </header>

  <div class="main-container">
    <div class="video-panel">
      <div class="video-wrapper" id="videoWrapper">
        <div id="videoFit">
          <video id="video" muted playsinline></video>
          <canvas id="canvas"></canvas>
        </div>
      </div>
    </div>

    <div class="control-panel">
      <div class="section">
        <div class="section-title">Input Video</div>
        <div class="file-drop-zone" id="fileDropZone">
          Click or drop an MP4 here
          <input type="file" id="videoInput" accept="video/*" />
        </div>
      </div>

      <div class="section">
        <div class="section-title">Preview</div>
        <div class="preview-buttons">
          <button id="previewPlayBtn" class="btn" disabled>Play</button>
          <button id="previewStopBtn" class="btn" disabled>Stop</button>
        </div>
        <div class="preview-time" id="previewTime">0:00 / 0:00</div>
      </div>

      <div class="section">
        <div class="section-title">Processing</div>
        <button id="startBtn" class="btn primary" disabled>Start Processing</button>
        <button id="exportBvhBtn" class="btn" disabled title="Export BVH">Export BVH</button>
      </div>

      <div class="section" style="display: none;">
        <div class="section-title">Depth (optional)</div>
        <div class="control-row">
          <label for="cameraFovInput">Camera horiz. FOV (deg)</label>
          <input type="number" id="cameraFovInput" value="60" step="1" min="10" max="160" />
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="useMiDaSCheckbox" />
          Use MiDaS depth (currently inactive)
        </label>
      </div>

      <div class="section">
        <div class="section-title">Progress</div>
        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
        <div class="info-row"><span>Frames recorded</span><span id="frameCount">0</span></div>
        <div class="info-row"><span>Video time</span><span id="videoTime">0.000s</span></div>
      </div>

      <div class="section">
        <div class="section-title">Status</div>
        <div class="status-box" id="status">Loading model...</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>

  <script>
    // ==================== DOM Elements ====================
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');
    const videoInput = document.getElementById('videoInput');
    const startBtn = document.getElementById('startBtn');
    const exportBvhBtn = document.getElementById('exportBvhBtn');
    const frameCountEl = document.getElementById('frameCount');
    const videoTimeEl = document.getElementById('videoTime');
    const fileDropZone = document.getElementById('fileDropZone');
    const videoWrapper = document.getElementById('videoWrapper');
    const videoFit = document.getElementById('videoFit');
    const previewPlayBtn = document.getElementById('previewPlayBtn');
    const previewStopBtn = document.getElementById('previewStopBtn');
    const previewTime = document.getElementById('previewTime');
    const cameraFovInput = document.getElementById('cameraFovInput');
    const useMiDaSCheckbox = document.getElementById('useMiDaSCheckbox');

    // ==================== State ====================
    let poseDetector;
    let processing = false;
    let isPreviewing = false;
    let recordedFrames = [];
    let previewFrameCallbackId = null;
    let prevCleanedPose2D = null;
    let prevCleanedPose3D = null;
    let stallTimeout = null;

    // ==================== Skeleton Hierarchy ====================
    const SKELETON_HIERARCHY = [
      { name: 'pelvis', parent: null },
      { name: 'left_hip', parent: 'pelvis' },
      { name: 'left_knee', parent: 'left_hip' },
      { name: 'left_ankle', parent: 'left_knee' },
      { name: 'left_foot', parent: 'left_ankle' },
      { name: 'right_hip', parent: 'pelvis' },
      { name: 'right_knee', parent: 'right_hip' },
      { name: 'right_ankle', parent: 'right_knee' },
      { name: 'right_foot', parent: 'right_ankle' },
      { name: 'chest', parent: 'pelvis' },
      { name: 'left_shoulder', parent: 'chest' },
      { name: 'left_elbow', parent: 'left_shoulder' },
      { name: 'left_wrist', parent: 'left_elbow' },
      { name: 'right_shoulder', parent: 'chest' },
      { name: 'right_elbow', parent: 'right_shoulder' },
      { name: 'right_wrist', parent: 'right_elbow' },
      { name: 'neck', parent: 'chest' },
      { name: 'head', parent: 'neck' },
    ];

    const HIGH_CONFIDENCE = 0.5;
    const LOW_CONFIDENCE = 0.2;
    const GLOBAL_AVERAGE_CONFIDENCE_THRESHOLD = 0.3;
    const MIN_RELIABLE_LANDMARKS = 10;

    // ==================== Video Fit Resizing ====================
    function resizeVideo() {
      if (!video.videoWidth || !video.videoHeight) return;
      const wrapperRect = videoWrapper.getBoundingClientRect();
      const wrapperWidth = wrapperRect.width;
      const wrapperHeight = wrapperRect.height;
      const videoAspect = video.videoWidth / video.videoHeight;
      const wrapperAspect = wrapperWidth / wrapperHeight;
      let fitWidth, fitHeight;
      if (videoAspect > wrapperAspect) {
        fitWidth = wrapperWidth;
        fitHeight = wrapperWidth / videoAspect;
      } else {
        fitHeight = wrapperHeight;
        fitWidth = wrapperHeight * videoAspect;
      }
      videoFit.style.width = fitWidth + 'px';
      videoFit.style.height = fitHeight + 'px';
      videoFit.style.left = (wrapperWidth - fitWidth) / 2 + 'px';
      videoFit.style.top = (wrapperHeight - fitHeight) / 2 + 'px';
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
    }
    window.addEventListener('resize', resizeVideo);

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }
    function updatePreviewTime() {
      if (video.duration) {
        previewTime.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
      }
    }

    // ==================== File Drop Zone ====================
    fileDropZone.addEventListener('click', () => videoInput.click());
    fileDropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      fileDropZone.classList.add('drag-over');
    });
    fileDropZone.addEventListener('dragleave', () => {
      fileDropZone.classList.remove('drag-over');
    });
    fileDropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      fileDropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) loadVideoFile(file);
    });
    videoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadVideoFile(file);
    });

    function loadVideoFile(file) {
      stopPreview();
      processing = false;
      recordedFrames = [];
      exportBvhBtn.disabled = true;
      startBtn.disabled = true;
      progressBar.style.width = '0%';
      frameCountEl.textContent = '0';
      videoTimeEl.textContent = '0.000s';
      statusEl.className = 'status-box';
      statusEl.textContent = 'Loading video metadata...';
      previewPlayBtn.disabled = true;
      previewStopBtn.disabled = true;
      previewTime.textContent = '0:00 / 0:00';
      prevCleanedPose2D = null;
      prevCleanedPose3D = null;
      if (stallTimeout) clearTimeout(stallTimeout);

      if (video.src) URL.revokeObjectURL(video.src);
      video.src = URL.createObjectURL(file);
      video.load();
    }

    video.addEventListener('loadedmetadata', () => {
      startBtn.disabled = false;
      previewPlayBtn.disabled = false;
      previewStopBtn.disabled = false;
      statusEl.textContent = `Loaded ${video.videoWidth}×${video.videoHeight}, duration ${video.duration.toFixed(2)}s.`;
      resizeVideo();
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      updatePreviewTime();
    });
    video.addEventListener('play', () => { previewPlayBtn.textContent = 'Pause'; });
    video.addEventListener('pause', () => { previewPlayBtn.textContent = 'Play'; });
    video.addEventListener('timeupdate', updatePreviewTime);
    video.addEventListener('ended', () => {
      if (isPreviewing) stopPreview();
      if (processing) finalizeProcessing();
      updatePreviewTime();
    });

    previewPlayBtn.addEventListener('click', () => {
      if (processing) return;
      if (isPreviewing) { video.pause(); stopPreview(); }
      else startPreview();
    });
    previewStopBtn.addEventListener('click', () => {
      if (processing) return;
      stopPreview();
      video.pause();
      video.currentTime = 0;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (video.readyState >= 2) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      updatePreviewTime();
      prevCleanedPose2D = null;
      prevCleanedPose3D = null;
    });

    async function startPreview() {
      if (!poseDetector) {
        statusEl.textContent = 'Model not ready yet.';
        statusEl.className = 'status-box error';
        return;
      }
      if (!video.src || video.readyState < 2) {
        statusEl.textContent = 'No video loaded.';
        statusEl.className = 'status-box error';
        return;
      }
      prevCleanedPose2D = null;
      prevCleanedPose3D = null;
      isPreviewing = true;
      previewPlayBtn.textContent = 'Pause';
      statusEl.textContent = 'Preview mode: skeleton tracking running...';
      statusEl.className = 'status-box';
      try {
        await video.play();
        previewFrameCallbackId = video.requestVideoFrameCallback(previewLoop);
      } catch (err) {
        isPreviewing = false;
        previewPlayBtn.textContent = 'Play';
        statusEl.textContent = 'Error playing video: ' + err.message;
        statusEl.className = 'status-box error';
      }
    }

    function stopPreview() {
      isPreviewing = false;
      previewPlayBtn.textContent = 'Play';
      if (previewFrameCallbackId !== null) {
        video.cancelVideoFrameCallback(previewFrameCallbackId);
        previewFrameCallbackId = null;
      }
    }

    function cleanPose2D(rawKeypoints) {
      if (!rawKeypoints || rawKeypoints.length === 0) return { landmarks: prevCleanedPose2D, valid: false };
      let sumScore = 0, reliableCount = 0;
      rawKeypoints.forEach(kp => { const s = kp.score ?? 0; sumScore += s; if (s >= LOW_CONFIDENCE) reliableCount++; });
      const avg = sumScore / rawKeypoints.length;
      if (reliableCount < MIN_RELIABLE_LANDMARKS || avg < GLOBAL_AVERAGE_CONFIDENCE_THRESHOLD) return { landmarks: prevCleanedPose2D, valid: false };
      if (!prevCleanedPose2D) {
        prevCleanedPose2D = rawKeypoints.map(kp => ({ x: kp.x, y: kp.y, confidence: kp.score ?? 0 }));
        return { landmarks: prevCleanedPose2D, valid: true };
      }
      const cleaned = rawKeypoints.map((kp, i) => {
        const prev = prevCleanedPose2D[i];
        if (!prev) return { x: kp.x, y: kp.y, confidence: kp.score ?? 0 };
        const score = kp.score ?? 0;
        let cw, pw;
        if (score >= HIGH_CONFIDENCE) { cw = 0.6; pw = 0.4; }
        else if (score >= LOW_CONFIDENCE) { cw = 0.4; pw = 0.6; }
        else { cw = 0.2; pw = 0.8; }
        return { x: prev.x * pw + kp.x * cw, y: prev.y * pw + kp.y * cw, confidence: score };
      });
      prevCleanedPose2D = cleaned;
      return { landmarks: cleaned, valid: true };
    }

    function cleanPose3D(rawKeypoints3D) {
      if (!rawKeypoints3D || rawKeypoints3D.length === 0) return { landmarks: prevCleanedPose3D, valid: false };
      let sumScore = 0, reliableCount = 0;
      rawKeypoints3D.forEach(kp => { const s = kp.score ?? 0; sumScore += s; if (s >= LOW_CONFIDENCE) reliableCount++; });
      const avg = sumScore / rawKeypoints3D.length;
      if (reliableCount < MIN_RELIABLE_LANDMARKS || avg < GLOBAL_AVERAGE_CONFIDENCE_THRESHOLD) return { landmarks: prevCleanedPose3D, valid: false };
      if (!prevCleanedPose3D) {
        prevCleanedPose3D = rawKeypoints3D.map(kp => ({ x: kp.x, y: kp.y, z: kp.z, confidence: kp.score ?? 0 }));
        return { landmarks: prevCleanedPose3D, valid: true };
      }
      const cleaned = rawKeypoints3D.map((kp, i) => {
        const prev = prevCleanedPose3D[i];
        if (!prev) return { x: kp.x, y: kp.y, z: kp.z, confidence: kp.score ?? 0 };
        const score = kp.score ?? 0;
        let cw, pw;
        if (score >= HIGH_CONFIDENCE) { cw = 0.6; pw = 0.4; }
        else if (score >= LOW_CONFIDENCE) { cw = 0.4; pw = 0.6; }
        else { cw = 0.2; pw = 0.8; }
        return { x: prev.x * pw + kp.x * cw, y: prev.y * pw + kp.y * cw, z: prev.z * pw + kp.z * cw, confidence: score };
      });
      prevCleanedPose3D = cleaned;
      return { landmarks: cleaned, valid: true };
    }

    function computeSkeletonGeneric(landmarks, globalValid, is3D) {
      if (!landmarks || landmarks.length === 0) return [];
      const joints = [];
      const jointByName = {};
      const directMap = {
        head: 0,
        left_shoulder: 11, left_elbow: 13, left_wrist: 15,
        right_shoulder: 12, right_elbow: 14, right_wrist: 16,
        left_hip: 23, left_knee: 25, left_ankle: 27, left_foot: 31,
        right_hip: 24, right_knee: 26, right_ankle: 28, right_foot: 32
      };
      for (const name of Object.keys(directMap)) {
        const idx = directMap[name];
        const lm = landmarks[idx];
        if (!lm || lm.confidence < LOW_CONFIDENCE || !globalValid) {
          joints.push({ name, position: lm ? (is3D ? { x: lm.x, y: lm.y, z: lm.z } : { x: lm.x, y: lm.y }) : null, confidence: lm ? lm.confidence : 0, valid: false });
        } else {
          joints.push({ name, position: is3D ? { x: lm.x, y: lm.y, z: lm.z } : { x: lm.x, y: lm.y }, confidence: lm.confidence, valid: true });
        }
        jointByName[name] = joints[joints.length - 1];
      }
      const derivedOrder = ['pelvis', 'chest', 'spine', 'neck'];
      for (const name of derivedOrder) {
        const spec = SKELETON_HIERARCHY.find(j => j.name === name);
        if (!spec) continue;
        let position = null, confidence = 0, valid = true;
        if (name === 'pelvis') {
          const lHip = landmarks[23], rHip = landmarks[24];
          if (lHip && rHip && lHip.confidence >= LOW_CONFIDENCE && rHip.confidence >= LOW_CONFIDENCE && globalValid) {
            position = is3D ? { x: (lHip.x + rHip.x) / 2, y: (lHip.y + rHip.y) / 2, z: (lHip.z + rHip.z) / 2 } : { x: (lHip.x + rHip.x) / 2, y: (lHip.y + rHip.y) / 2 };
            confidence = (lHip.confidence + rHip.confidence) / 2; valid = true;
          } else { valid = false; if (lHip && lHip.confidence >= LOW_CONFIDENCE) { position = is3D ? { x: lHip.x, y: lHip.y, z: lHip.z } : { x: lHip.x, y: lHip.y }; confidence = lHip.confidence; } }
        } else if (name === 'chest') {
          const lS = landmarks[11], rS = landmarks[12];
          if (lS && rS && lS.confidence >= LOW_CONFIDENCE && rS.confidence >= LOW_CONFIDENCE && globalValid) {
            position = is3D ? { x: (lS.x + rS.x) / 2, y: (lS.y + rS.y) / 2, z: (lS.z + rS.z) / 2 } : { x: (lS.x + rS.x) / 2, y: (lS.y + rS.y) / 2 };
            confidence = (lS.confidence + rS.confidence) / 2; valid = true;
          } else valid = false;
        } else if (name === 'neck') {
          const chest = jointByName['chest'], head = jointByName['head'];
          if (chest && head && chest.valid && head.valid && globalValid) {
            position = is3D ? { x: (chest.position.x + head.position.x) / 2, y: (chest.position.y + head.position.y) / 2, z: (chest.position.z + head.position.z) / 2 } : { x: (chest.position.x + head.position.x) / 2, y: (chest.position.y + head.position.y) / 2 };
            confidence = (chest.confidence + head.confidence) / 2; valid = true;
          } else valid = false;
        }
        if (position) { joints.push({ name, position, confidence, valid }); jointByName[name] = joints[joints.length - 1]; }
      }
      return SKELETON_HIERARCHY.map(spec => {
        const j = joints.find(j => j.name === spec.name);
        return j ? { ...j, parent: spec.parent } : { name: spec.name, position: null, confidence: 0, valid: false, parent: spec.parent };
      }).filter(Boolean);
    }

    function computeSkeleton2D(landmarks, globalValid) { return computeSkeletonGeneric(landmarks, globalValid, false); }
    function computeSkeleton3D(landmarks, globalValid) { return computeSkeletonGeneric(landmarks, globalValid, true); }

    function previewLoop(now, metadata) {
      if (!isPreviewing || video.paused || video.ended) { stopPreview(); return; }
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const frameTime = metadata && metadata.mediaTime !== undefined ? metadata.mediaTime : video.currentTime;
      poseDetector.estimatePoses(video, { flipHorizontal: false })
        .then((poses) => {
          if (!isPreviewing) return;
          let raw = null;
          if (poses && poses.length > 0) raw = poses[0].keypoints;
          const clean = cleanPose2D(raw);
          const skeleton2D = computeSkeleton2D(clean.landmarks, clean.valid);
          drawSkeletonPreview(skeleton2D, clean.valid);
          if (isPreviewing && !video.paused && !video.ended) previewFrameCallbackId = video.requestVideoFrameCallback(previewLoop);
          else stopPreview();
        })
        .catch(err => { console.error(err); stopPreview(); statusEl.textContent = 'Preview error: ' + err.message; statusEl.className = 'status-box error'; });
    }

    async function initPoseDetector() {
      try {
        statusEl.textContent = 'Setting up TensorFlow.js backend...';
        await tf.setBackend('webgl');
        await tf.ready();
        statusEl.textContent = 'Loading BlazePose model...';
        poseDetector = await poseDetection.createDetector(poseDetection.SupportedModels.BlazePose, {
          runtime: 'mediapipe',
          solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/pose',
          modelType: 'full'
        });
        statusEl.textContent = 'Model ready. Select a local MP4 video.';
        statusEl.className = 'status-box success';
      } catch (err) {
        statusEl.textContent = 'Error loading model: ' + err.message;
        statusEl.className = 'status-box error';
        console.error(err);
      }
    }

    function finalizeProcessing() {
      if (!processing) return;
      processing = false;
      startBtn.disabled = false;
      exportBvhBtn.disabled = false;
      previewPlayBtn.disabled = false;
      previewStopBtn.disabled = false;
      statusEl.textContent = `Done. Recorded ${recordedFrames.length} frames. Export BVH.`;
      statusEl.className = 'status-box success';
      updatePreviewTime();
      if (stallTimeout) { clearTimeout(stallTimeout); stallTimeout = null; }
    }

    startBtn.addEventListener('click', async () => {
      if (!poseDetector || !video.src || video.readyState < 2) {
        statusEl.textContent = 'Please select a video first.';
        statusEl.className = 'status-box error';
        return;
      }
    
      if (processing) return;
    
      stopPreview();
      prevCleanedPose2D = null;
      prevCleanedPose3D = null;
    
      processing = true;
      recordedFrames = [];
    
      exportBvhBtn.disabled = true;
      startBtn.disabled = true;
      previewPlayBtn.disabled = true;
      previewStopBtn.disabled = true;
    
      progressBar.style.width = '0%';
      frameCountEl.textContent = '0';
      videoTimeEl.textContent = '0.000s';
    
      statusEl.className = 'status-box';
      statusEl.textContent = 'Processing every source video frame...';
    
      video.pause();
    
      try {
        await processAllVideoFrames();
      } catch (err) {
        console.error('Processing error:', err);
        processing = false;
        startBtn.disabled = false;
        previewPlayBtn.disabled = false;
        previewStopBtn.disabled = false;
    
        statusEl.textContent = 'Processing error: ' + err.message;
        statusEl.className = 'status-box error';
      }
    });
    
    
    async function seekVideoTo(time) {
      return new Promise((resolve, reject) => {
        const onSeeked = () => {
          cleanup();
          resolve();
        };
    
        const onError = () => {
          cleanup();
          reject(new Error('Video seek failed.'));
        };
    
        const cleanup = () => {
          video.removeEventListener('seeked', onSeeked);
          video.removeEventListener('error', onError);
        };
    
        video.addEventListener('seeked', onSeeked, { once: true });
        video.addEventListener('error', onError, { once: true });
    
        video.currentTime = Math.max(
          0,
          Math.min(time, Math.max(0, video.duration - 0.0001))
        );
      });
    }
    
    
    async function processAllVideoFrames() {
      /*
       * Determine the source video's frame rate.
       *
       * 30 FPS is used as the fallback because browser video metadata
       * does not always expose the exact encoded frame rate.
       */
      const fps = 30;
      const frameTime = 1 / fps;
    
      const totalFrames = Math.max(
        1,
        Math.round(video.duration * fps)
      );
    
      for (let frameIndex = 0; frameIndex < totalFrames; frameIndex++) {
        if (!processing) return;
    
        const targetTime = Math.min(
          frameIndex * frameTime,
          Math.max(0, video.duration - 0.0001)
        );
    
        await seekVideoTo(targetTime);
    
        if (!processing) return;
    
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
        let poses = null;
    
        try {
          poses = await poseDetector.estimatePoses(video, {
            flipHorizontal: false
          });
        } catch (err) {
          console.error(`Pose detection failed at frame ${frameIndex}:`, err);
          poses = null;
        }
    
        if (!processing) return;
    
        let raw2D = null;
        let raw3D = null;
    
        if (poses && poses.length > 0) {
          raw2D = poses[0].keypoints;
          raw3D = poses[0].keypoints3D || null;
        }
    
        const clean2D = cleanPose2D(raw2D);
        const clean3D = cleanPose3D(raw3D);
    
        const skeleton2D = computeSkeleton2D(
          clean2D.landmarks,
          clean2D.valid
        );
    
        const skeleton3D = computeSkeleton3D(
          clean3D.landmarks,
          clean3D.valid
        );
    
        const frameData = {
          time: targetTime,
          skeleton2D,
          skeleton3D,
    
          rawLandmarks2D: clean2D.landmarks
            ? clean2D.landmarks.map(kp => ({
                x: kp.x,
                y: kp.y,
                score: kp.confidence ?? 0
              }))
            : null,
    
          rawLandmarks3D: clean3D.landmarks
            ? clean3D.landmarks.map(kp => ({
                x: kp.x,
                y: kp.y,
                z: kp.z,
                score: kp.confidence ?? 0
              }))
            : null
        };
    
        recordedFrames.push(frameData);
    
        drawSkeletonPreview(
          skeleton2D,
          clean2D.valid
        );
    
        const progress =
          ((frameIndex + 1) / totalFrames) * 100;
    
        progressBar.style.width =
          progress.toFixed(1) + '%';
    
        frameCountEl.textContent =
          recordedFrames.length;
    
        videoTimeEl.textContent =
          targetTime.toFixed(3) + 's';
    
        statusEl.textContent =
          `Frame ${frameIndex + 1}/${totalFrames} | ` +
          `t=${targetTime.toFixed(3)}s | ` +
          `${progress.toFixed(1)}%`;
      }
    
      finalizeProcessing();
    }
    function drawSkeletonPreview(skeleton, frameValid) {
      if (video.readyState >= 2) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      if (!skeleton || skeleton.length === 0) return;
      skeleton.forEach(joint => {
        if (!joint.parent) return;
        const parentJoint = skeleton.find(j => j.name === joint.parent);
        if (!parentJoint || !joint.position || !parentJoint.position) return;
        if (!joint.valid || !parentJoint.valid) return;
        const conf = Math.min(joint.confidence, parentJoint.confidence);
        let strokeColor = '#00e676';
        if (conf < LOW_CONFIDENCE) strokeColor = '#ff4444';
        else if (conf < HIGH_CONFIDENCE) strokeColor = '#ffaa00';
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(parentJoint.position.x, parentJoint.position.y);
        ctx.lineTo(joint.position.x, joint.position.y);
        ctx.stroke();
      });
      skeleton.forEach(joint => {
        if (!joint.position) return;
        let fillColor, radius = 5;
        if (!joint.valid) fillColor = '#ff8800';
        else if (joint.confidence < LOW_CONFIDENCE) fillColor = '#ff4444';
        else if (joint.confidence < HIGH_CONFIDENCE) fillColor = '#ffaa00';
        else fillColor = '#00e676';
        ctx.fillStyle = fillColor;
        ctx.beginPath();
        ctx.arc(joint.position.x, joint.position.y, radius, 0, 2 * Math.PI);
        ctx.fill();
      });
    }

    // ==================== BVH Math ====================
    function vec3(x,y,z) { return {x,y,z}; }
    function vecAdd(a,b) { return vec3(a.x+b.x, a.y+b.y, a.z+b.z); }
    function vecSub(a,b) { return vec3(a.x-b.x, a.y-b.y, a.z-b.z); }
    function vecScale(a,s) { return vec3(a.x*s, a.y*s, a.z*s); }
    function vecLength(a) { return Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z); }
    function vecNormalize(a) { const l = vecLength(a); if (l < 1e-10) return vec3(0,0,0); return vecScale(a, 1/l); }
    function vecDot(a,b) { return a.x*b.x + a.y*b.y + a.z*b.z; }
    function vecCross(a,b) { return vec3(a.y*b.z - a.z*b.y, a.z*b.x - a.x*b.z, a.x*b.y - a.y*b.x); }

    function quatIdentity() { return {w:1, x:0, y:0, z:0}; }
    function quatNormalize(q) {
      const l = Math.sqrt(q.w*q.w + q.x*q.x + q.y*q.y + q.z*q.z);
      if (!Number.isFinite(l) || l < 1e-10) return quatIdentity();
      return { w: q.w/l, x: q.x/l, y: q.y/l, z: q.z/l };
    }
    function quatMultiply(q1,q2) {
      return {
        w: q1.w*q2.w - q1.x*q2.x - q1.y*q2.y - q1.z*q2.z,
        x: q1.w*q2.x + q1.x*q2.w + q1.y*q2.z - q1.z*q2.y,
        y: q1.w*q2.y - q1.x*q2.z + q1.y*q2.w + q1.z*q2.x,
        z: q1.w*q2.z + q1.x*q2.y - q1.y*q2.x + q1.z*q2.w
      };
    }
    function quatConjugate(q) { return {w:q.w, x:-q.x, y:-q.y, z:-q.z}; }
    function quatRotate(q, v) {
      const qv = {w:0, x:v.x, y:v.y, z:v.z};
      const qvRot = quatMultiply(quatMultiply(q, qv), quatConjugate(q));
      return vec3(qvRot.x, qvRot.y, qvRot.z);
    }
    function quatFromTwoVectors(a, b) {
      a = vecNormalize(a); b = vecNormalize(b);
      if (vecLength(a) < 1e-10 || vecLength(b) < 1e-10) return quatIdentity();
      const dot = vecDot(a,b);
      if (dot > 0.9999) return quatIdentity();
      if (dot < -0.9999) {
        const axis = Math.abs(a.x) < 0.9 ? vec3(1,0,0) : vec3(0,1,0);
        const ort = vecNormalize(vecCross(a, axis));
        return {w:0, x:ort.x, y:ort.y, z:ort.z};
      }
      const axis = vecCross(a,b);
      const w = 1 + dot;
      const q = {w, x:axis.x, y:axis.y, z:axis.z};
      const l = Math.sqrt(q.w*q.w + q.x*q.x + q.y*q.y + q.z*q.z);
      return {w:q.w/l, x:q.x/l, y:q.y/l, z:q.z/l};
    }
    function quatFromBasis(xAxis, yAxis, zAxis) {
      const m00 = xAxis.x, m01 = yAxis.x, m02 = zAxis.x;
      const m10 = xAxis.y, m11 = yAxis.y, m12 = zAxis.y;
      const m20 = xAxis.z, m21 = yAxis.z, m22 = zAxis.z;
      const trace = m00 + m11 + m22;
      let q;
      if (trace > 0) {
        const s = Math.sqrt(trace + 1.0) * 2;
        q = { w: 0.25*s, x: (m21 - m12)/s, y: (m02 - m20)/s, z: (m10 - m01)/s };
      } else if (m00 > m11 && m00 > m22) {
        const s = Math.sqrt(1.0 + m00 - m11 - m22) * 2;
        q = { w: (m21 - m12)/s, x: 0.25*s, y: (m01 + m10)/s, z: (m02 + m20)/s };
      } else if (m11 > m22) {
        const s = Math.sqrt(1.0 + m11 - m00 - m22) * 2;
        q = { w: (m02 - m20)/s, x: (m01 + m10)/s, y: 0.25*s, z: (m12 + m21)/s };
      } else {
        const s = Math.sqrt(1.0 + m22 - m00 - m11) * 2;
        q = { w: (m10 - m01)/s, x: (m02 + m20)/s, y: (m12 + m21)/s, z: 0.25*s };
      }
      const l = Math.sqrt(q.w*q.w + q.x*q.x + q.y*q.y + q.z*q.z);
      if (l < 1e-10) return quatIdentity();
      return { w: q.w/l, x: q.x/l, y: q.y/l, z: q.z/l };
    }

    function median(arr) {
      if (!arr.length) return 0;
      const sorted = [...arr].sort((a,b)=>a-b);
      const mid = Math.floor(sorted.length/2);
      return sorted.length % 2 ? sorted[mid] : (sorted[mid-1]+sorted[mid])/2;
    }

    // ==================== Coordinate Conversion ====================
    // Use BVH axes: X right, Y up, Z forward.
    // BlazePose: X right, Y up, Z toward camera (so forward is +Z).
    function blazeToBVH(p) {
      if (!p) return null;
      return vec3(-p.x, -p.y, p.z);
    }

    function finiteVec3(v) {
      return !!v && Number.isFinite(v.x) && Number.isFinite(v.y) && Number.isFinite(v.z);
    }
    function getJoint(wf, name) {
      if (!wf || !wf.joints) return null;
      return finiteVec3(wf.joints[name]) ? wf.joints[name] : null;
    }

    function buildWorldFramesFromBlazePose() {
      const frames = recordedFrames.map(frame => {
        const joints = {};
        if (frame.skeleton3D) {
          frame.skeleton3D.forEach(j => {
            if (j && j.position) {
              const p = blazeToBVH(j.position);
              if (finiteVec3(p)) joints[j.name] = p;
            }
          });
        }
        return { time: Number.isFinite(frame.time) ? frame.time : 0, joints, rawLandmarks2D: frame.rawLandmarks2D || null };
      });
      if (!frames.length) return null;

      let referenceIndex = -1;
      for (let i = 0; i < frames.length; i++) {
        const f = frames[i];
        const required = ['pelvis','left_hip','right_hip','chest','left_shoulder','right_shoulder'];
        if (required.every(name => finiteVec3(f.joints[name]))) { referenceIndex = i; break; }
      }
      if (referenceIndex < 0) return null;

      let previous = {};
      for (let i = 0; i < frames.length; i++) {
        const f = frames[i];
        const completed = {};
        for (const spec of SKELETON_HIERARCHY) {
          const cur = f.joints[spec.name];
          if (finiteVec3(cur)) completed[spec.name] = cur;
          else if (finiteVec3(previous[spec.name])) completed[spec.name] = previous[spec.name];
          else completed[spec.name] = null;
        }
        f.joints = completed;
        for (const name in completed) if (finiteVec3(completed[name])) previous[name] = completed[name];
      }

      const reference = frames[referenceIndex];
      const referencePelvis = getJoint(reference, 'pelvis');

      // Use 2D pelvis displacement to recover global root translation.
      // (BlazePose 3D origin is the hip midpoint, so 3D pelvis is always near origin.)
      function get2DPelvis(lms) {
        if (!lms || lms.length < 25) return null;
        const lh = lms[23], rh = lms[24];
        if (!lh || !rh || !Number.isFinite(lh.x) || !Number.isFinite(lh.y) ||
            !Number.isFinite(rh.x) || !Number.isFinite(rh.y)) return null;
        if ((lh.score ?? 0) < LOW_CONFIDENCE || (rh.score ?? 0) < LOW_CONFIDENCE) return null;
        return { x: (lh.x + rh.x) / 2, y: (lh.y + rh.y) / 2 };
      }

      // Estimate meters-per-normalized-image-unit from 3D/2D hip width.
      const scales = [];
      for (const f of frames) {
        const lms = f.rawLandmarks2D;
        const lh3 = getJoint(f, 'left_hip');
        const rh3 = getJoint(f, 'right_hip');
        if (!lms || !lms[23] || !lms[24] || !lh3 || !rh3) continue;
        const d2 = Math.hypot(lms[23].x - lms[24].x, lms[23].y - lms[24].y);
        const d3 = vecLength(vecSub(rh3, lh3));
        if (d2 > 1e-8 && d3 > 1e-8) scales.push(d3 / d2);
      }
      const rootScale = scales.length ? median(scales) : 1.0;

      const ref2DPelvis = get2DPelvis(reference.rawLandmarks2D);
      frames.forEach(frame => {
        const pelvis = getJoint(frame, 'pelvis');
        const current2DPelvis = get2DPelvis(frame.rawLandmarks2D);
        if (ref2DPelvis && current2DPelvis) {
          const dx = -(current2DPelvis.x - ref2DPelvis.x);
          const dy = -(current2DPelvis.y - ref2DPelvis.y); // BVH Y is up
          frame.rootTranslation = vec3(dx * rootScale, dy * rootScale, 0);
        } else if (pelvis && referencePelvis) {
          frame.rootTranslation = vecSub(pelvis, referencePelvis);
        } else {
          frame.rootTranslation = vec3(0, 0, 0);
        }
      });
      return { frames, referenceIndex };
    }

    function computeRootRotation(wf) {
      const pelvis = getJoint(wf, 'pelvis');
      const chest = getJoint(wf, 'chest');
      const leftHip = getJoint(wf, 'left_hip');
      const rightHip = getJoint(wf, 'right_hip');
      if (!pelvis || !chest || !leftHip || !rightHip) return quatIdentity();
      const right = vecNormalize(vecSub(rightHip, leftHip));
      const up = vecNormalize(vecSub(chest, pelvis));
      if (vecLength(right) < 1e-8 || vecLength(up) < 1e-8) return quatIdentity();
      const forward = vecNormalize(vecCross(right, up));
      if (vecLength(forward) < 1e-8) return quatIdentity();
      const trueUp = vecNormalize(vecCross(forward, right));
      if (vecLength(trueUp) < 1e-8) return quatIdentity();
      return quatFromBasis(right, trueUp, forward);
    }

    function computeChestWorldFrame(wf) {
      const chest = getJoint(wf, 'chest');
      const neck = getJoint(wf, 'neck');
      const lS = getJoint(wf, 'left_shoulder');
      const rS = getJoint(wf, 'right_shoulder');
      if (!chest || !neck || !lS || !rS) return null;
      const right = vecNormalize(vecSub(rS, lS));
      const up = vecNormalize(vecSub(neck, chest));
      if (vecLength(right) < 1e-8 || vecLength(up) < 1e-8) return null;
      const forward = vecNormalize(vecCross(right, up));
      if (vecLength(forward) < 1e-8) return null;
      const trueUp = vecNormalize(vecCross(forward, right));
      if (vecLength(trueUp) < 1e-8) return null;
      return quatFromBasis(right, trueUp, forward);
    }

    function quatToBVHZXY(q) {
      q = quatNormalize(q);
      const x = q.x, y = q.y, z = q.z, w = q.w;
      const x2 = x+x, y2 = y+y, z2 = z+z;
      const xx = x*x2, xy = x*y2, xz = x*z2, yy = y*y2, yz = y*z2, zz = z*z2;
      const wx = w*x2, wy = w*y2, wz = w*z2;
      const m00 = 1 - (yy + zz), m01 = xy - wz, m02 = xz + wy;
      const m10 = xy + wz, m11 = 1 - (xx + zz), m12 = yz - wx;
      const m20 = xz - wy, m21 = yz + wx, m22 = 1 - (xx + yy);
      const sx = Math.max(-1, Math.min(1, m21));
      const xAngle = Math.asin(sx);
      let zAngle, yAngle;
      if (Math.abs(Math.cos(xAngle)) > 1e-6) {
        zAngle = Math.atan2(-m01, m11);
        const cz = Math.cos(zAngle), sz = Math.sin(zAngle);
        const yNum = m02*cz + m12*sz;
        const yDen = m00*cz + m10*sz;
        yAngle = Math.atan2(yNum, yDen);
      } else {
        zAngle = 0;
        yAngle = Math.atan2(m02, m00);
      }
      const radToDeg = 180 / Math.PI;
      const result = { z: zAngle*radToDeg, x: xAngle*radToDeg, y: yAngle*radToDeg };
      if (!Number.isFinite(result.x) || !Number.isFinite(result.y) || !Number.isFinite(result.z)) return { z:0, x:0, y:0 };
      return result;
    }

    function computeRotationsForFrame(wf, restOffsets, previousWorldRots) {
      const worldRots = {};
      const localRots = {};

      // Root: pelvis
      worldRots['pelvis'] = computeRootRotation(wf);
      localRots['pelvis'] = worldRots['pelvis'];

      // Chest: full anatomical frame from shoulders/neck
      const chestFrame = computeChestWorldFrame(wf);
      if (chestFrame) {
        worldRots['chest'] = chestFrame;
        localRots['chest'] = quatNormalize(quatMultiply(quatConjugate(worldRots['pelvis'] || quatIdentity()), chestFrame));
      } else {
        worldRots['chest'] = worldRots['pelvis'];
        localRots['chest'] = quatIdentity();
      }

      // Remaining joints in hierarchy order
      for (let i = 1; i < SKELETON_HIERARCHY.length; i++) {
        const spec = SKELETON_HIERARCHY[i];
        const name = spec.name;
        if (name === 'pelvis' || name === 'chest') continue;

        const parentName = spec.parent;
        const parentWorldRot = worldRots[parentName] || quatIdentity();
        const childName = SKELETON_HIERARCHY.find(j => j.parent === name)?.name;

        let localRot = quatIdentity();
        let worldRot = parentWorldRot;

        if (childName) {
          const jointPos = getJoint(wf, name);
          const childPos = getJoint(wf, childName);
          if (jointPos && childPos) {
            const boneWorld = vecNormalize(vecSub(childPos, jointPos));
            if (vecLength(boneWorld) > 1e-8) {
              const boneLocal = quatRotate(quatConjugate(parentWorldRot), boneWorld);
              const restDir = vecNormalize(restOffsets[childName] || vec3(0,0,1));
              localRot = quatFromTwoVectors(restDir, boneLocal);
              worldRot = quatMultiply(parentWorldRot, localRot);
            }
          } else if (previousWorldRots && previousWorldRots[name]) {
            worldRot = previousWorldRots[name];
          }
        } else {
          // Leaf joint: no outgoing bone, keep parent orientation
          worldRot = parentWorldRot;
        }

        worldRots[name] = quatNormalize(worldRot);
        localRots[name] = quatNormalize(localRot);
      }

      const euler = {};
      for (const spec of SKELETON_HIERARCHY) {
        euler[spec.name] = quatToBVHZXY(localRots[spec.name] || quatIdentity());
      }
      return { euler, worldRots };
    }

    function buildHierarchy(restOffsets) {
      function jointToBVH(name, indent) {
        const spec = SKELETON_HIERARCHY.find(j => j.name === name);
        if (!spec) return '';
        const lines = [];
        const pad = '  '.repeat(indent);
        if (spec.parent === null) {
          lines.push(`${pad}ROOT ${name}`);
          lines.push(`${pad}{`);
          lines.push(`${pad}  OFFSET 0.000000 0.000000 0.000000`);
          lines.push(`${pad}  CHANNELS 6 Xposition Yposition Zposition Zrotation Xrotation Yrotation`);
        } else {
          lines.push(`${pad}JOINT ${name}`);
          lines.push(`${pad}{`);
          const off = restOffsets[name] || vec3(0,0,0);
          lines.push(`${pad}  OFFSET ${off.x.toFixed(6)} ${off.y.toFixed(6)} ${off.z.toFixed(6)}`);
          lines.push(`${pad}  CHANNELS 3 Zrotation Xrotation Yrotation`);
        }
        const children = SKELETON_HIERARCHY.filter(j => j.parent === name);
        if (children.length === 0) {
          const off = restOffsets[name] || vec3(0,0,0);
          let endDir;
          if (vecLength(off) > 1e-8) endDir = vecNormalize(off);
          else endDir = vec3(0,0,0.05);
          const endLen = Math.max(vecLength(off) * 0.15, 0.02);
          const endOffset = vecScale(endDir, endLen);
          lines.push(`${pad}  End Site`);
          lines.push(`${pad}  {`);
          lines.push(`${pad}    OFFSET ${endOffset.x.toFixed(6)} ${endOffset.y.toFixed(6)} ${endOffset.z.toFixed(6)}`);
          lines.push(`${pad}  }`);
        } else {
          children.forEach(child => lines.push(jointToBVH(child.name, indent + 1)));
        }
        lines.push(`${pad}}`);
        return lines.join('\n');
      }
      return jointToBVH('pelvis', 0);
    }

    function computeMedianBoneLengths(frames) {
      const restOffsets = {};
      // BVH axes: X right, Y up, Z forward.
      const directions = {
        left_hip: vec3(-1, -1, 0),
        left_knee: vec3(-1, -1, 0),
        left_ankle: vec3(-1, -1, 0),
        left_foot: vec3(-1, 0, 1),
        right_hip: vec3(1, -1, 0),
        right_knee: vec3(1, -1, 0),
        right_ankle: vec3(1, -1, 0),
        right_foot: vec3(1, 0, 1),
        chest: vec3(0, 1, 0),
        left_shoulder: vec3(-1, 0, 0),
        left_elbow: vec3(-1, 0, 0),
        left_wrist: vec3(-1, 0, 0),
        right_shoulder: vec3(1, 0, 0),
        right_elbow: vec3(1, 0, 0),
        right_wrist: vec3(1, 0, 0),
        neck: vec3(0, 1, 0),
        head: vec3(0, 1, 0),
      };
      for (const name in directions) directions[name] = vecNormalize(directions[name]);

      for (const spec of SKELETON_HIERARCHY) {
        if (!spec.parent) continue;
        const lengths = [];
        for (const wf of frames) {
          const parentPos = getJoint(wf, spec.parent);
          const childPos = getJoint(wf, spec.name);
          if (parentPos && childPos) {
            const len = vecLength(vecSub(childPos, parentPos));
            if (len > 1e-8) lengths.push(len);
          }
        }
        if (lengths.length > 0) {
          const medianLen = median(lengths);
          const dir = directions[spec.name] || vec3(0,0,1);
          restOffsets[spec.name] = vecScale(dir, medianLen);
        } else {
          restOffsets[spec.name] = vec3(0,0,0);
        }
      }
      return restOffsets;
    }

    function calculateFrameTime() {
      const times = recordedFrames.map(f => Number(f.time)).filter(Number.isFinite);
      const diffs = [];
      for (let i = 1; i < times.length; i++) {
        const d = times[i] - times[i - 1];
        if (Number.isFinite(d) && d > 0 && d < 1) diffs.push(d);
      }
      if (!diffs.length) return 1 / 30;
      return median(diffs);
    }

    function buildMotionLines(worldData, restOffsets) {
      if (!worldData || !worldData.frames || !worldData.frames.length) return [];
      const frames = worldData.frames;
      let previousWorldRots = null;
      let previousEuler = null;
      let previousRoot = null;
      const SMOOTHING_FACTOR = 0.75;

      return frames.map(wf => {
        const rotationData = computeRotationsForFrame(wf, restOffsets, previousWorldRots);
        previousWorldRots = rotationData.worldRots;
        let e = rotationData.euler;

        if (!previousEuler) {
          previousEuler = {};
          for (const spec of SKELETON_HIERARCHY) previousEuler[spec.name] = { ...e[spec.name] };
        } else {
          for (const spec of SKELETON_HIERARCHY) {
            const prev = previousEuler[spec.name];
            const curr = e[spec.name];
            if (prev && curr) {
              const unwrapped = {
                x: curr.x + 360 * Math.round((prev.x - curr.x) / 360),
                y: curr.y + 360 * Math.round((prev.y - curr.y) / 360),
                z: curr.z + 360 * Math.round((prev.z - curr.z) / 360)
              };
              e[spec.name] = {
                x: prev.x + SMOOTHING_FACTOR * (unwrapped.x - prev.x),
                y: prev.y + SMOOTHING_FACTOR * (unwrapped.y - prev.y),
                z: prev.z + SMOOTHING_FACTOR * (unwrapped.z - prev.z)
              };
            }
            previousEuler[spec.name] = { ...e[spec.name] };
          }
        }

        let rootPos = wf.rootTranslation || vec3(0,0,0);
        if (!previousRoot) previousRoot = { ...rootPos };
        else {
          rootPos = vec3(
            previousRoot.x + SMOOTHING_FACTOR * (rootPos.x - previousRoot.x),
            previousRoot.y + SMOOTHING_FACTOR * (rootPos.y - previousRoot.y),
            previousRoot.z + SMOOTHING_FACTOR * (rootPos.z - previousRoot.z)
          );
          previousRoot = { ...rootPos };
        }

        const root = e.pelvis || { z:0, x:0, y:0 };
        let line = `${Number.isFinite(rootPos.x) ? rootPos.x : 0} ${Number.isFinite(rootPos.y) ? rootPos.y : 0} ${Number.isFinite(rootPos.z) ? rootPos.z : 0}`;
        line += ` ${root.z.toFixed(6)} ${root.x.toFixed(6)} ${root.y.toFixed(6)}`;
        for (let i = 1; i < SKELETON_HIERARCHY.length; i++) {
          const name = SKELETON_HIERARCHY[i].name;
          const r = e[name] || { z:0, x:0, y:0 };
          line += ` ${Number.isFinite(r.z) ? r.z.toFixed(6) : '0.000000'} ${Number.isFinite(r.x) ? r.x.toFixed(6) : '0.000000'} ${Number.isFinite(r.y) ? r.y.toFixed(6) : '0.000000'}`;
        }
        return line;
      });
    }

    function computeBVHFromWorldFrames(worldData) {
      if (!worldData || !worldData.frames || worldData.frames.length < 2) return null;
      const restOffsets = computeMedianBoneLengths(worldData.frames);
      const hierarchy = buildHierarchy(restOffsets);
      const frameTime = calculateFrameTime();
      const motionLines = buildMotionLines(worldData, restOffsets);
      if (!motionLines.length || !Number.isFinite(frameTime) || frameTime <= 0) return null;
      return `HIERARCHY\n${hierarchy}\nMOTION\nFrames: ${motionLines.length}\nFrame Time: ${frameTime.toFixed(6)}\n${motionLines.join('\n')}`;
    }

    function computeBVH() {
      if (recordedFrames.length < 2) return null;
      const worldData = buildWorldFramesFromBlazePose();
      if (!worldData) return null;
      return computeBVHFromWorldFrames(worldData);
    }

    exportBvhBtn.addEventListener('click', () => {
      const bvh = computeBVH();
      if (!bvh) {
        statusEl.textContent = 'BVH generation failed: not enough data.';
        statusEl.className = 'status-box error';
        return;
      }
      const blob = new Blob([bvh], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'mocap.bvh';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      statusEl.textContent = 'BVH exported successfully.';
      statusEl.className = 'status-box success';
    });

    useMiDaSCheckbox.addEventListener('change', (ev) => {
      if (ev.target.checked) {
        statusEl.textContent = 'MiDaS fusion is not implemented. Using BlazePose only.';
        statusEl.className = 'status-box';
      } else {
        statusEl.textContent = 'Using BlazePose only.';
        statusEl.className = 'status-box';
      }
    });

    initPoseDetector();
  </script>
</body>
</html>
